[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "asml_product_p9_tco"
version = "0.1.0"
description = "LPP vs FEL TCO comparator — may lose (P9)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
include = ["asml_product_p9_tco*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
